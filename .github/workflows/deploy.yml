# Flujo de GitHub Actions: en cada push a main instala dependencias, compila
# con "npm run build" y publica la carpeta dist en GitHub Pages.
# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Dos trabajos: build (compila) y deploy (publica). deploy espera a build (needs).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # This repository is the user site (sebastianjaimesr.github.io), served from the root.
          # For a project site use "/<repo-name>/" instead.
          BASE_PATH: /sebastianjaimesr/
          VITE_SITE_URL: https://sebastianjaimesr.github.io/sebastianjaimesr
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
