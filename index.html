<!doctype html>
<html lang="en">
  <!-- Página HTML base. React se monta dentro de <div id="root">; Vite inyecta los estilos y scripts al compilar. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sebastian Jaimes · Full-Stack Developer in Training</title>
    <meta
      name="description"
      content="Portfolio of Sebastian Jaimes, a Full-Stack Developer in training from Bucaramanga, Colombia, open to junior opportunities and collaborations."
    />
    <meta name="author" content="Sebastian Jaimes" />
    <meta name="theme-color" content="#070910" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph y Twitter: controlan cómo se ve el enlace al compartirlo en redes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sebastian Jaimes" />
    <meta property="og:title" content="Sebastian Jaimes · Full-Stack Developer in Training" />
    <meta
      property="og:description"
      content="An immersive portfolio by Sebastian Jaimes, a Full-Stack Developer in training from Bucaramanga, Colombia."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_CO" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sebastian Jaimes, Digital Universe, Full-Stack Developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sebastian Jaimes · Full-Stack Developer in Training" />
    <meta
      name="twitter:description"
      content="An immersive portfolio by Sebastian Jaimes, a Full-Stack Developer in training from Bucaramanga, Colombia."
    />

    <!-- Datos estructurados (schema.org): ayudan a Google a entender que la página es de una persona. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sebastian Jaimes",
        "jobTitle": "Full-Stack Developer in Training",
        "address": { "@type": "PostalAddress", "addressLocality": "Bucaramanga", "addressCountry": "CO" },
        "sameAs": ["https://github.com/sebastianjaimesr", "https://www.linkedin.com/in/sebastian-jaimes-1a2259398/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Contenido mínimo si el navegador tiene JavaScript desactivado. -->
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #f4f6ff; background: #070910">
        <h1>Sebastian Jaimes</h1>
        <p>Full-Stack Developer in Training · Bucaramanga, Colombia</p>
        <p>
          <a style="color: #7c9dff" href="mailto:jsrolon01@gmail.com">jsrolon01@gmail.com</a> ·
          <a style="color: #7c9dff" href="https://github.com/sebastianjaimesr">GitHub</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
