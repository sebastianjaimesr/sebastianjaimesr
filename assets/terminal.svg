  <desc id="d">Terminal: whoami, Juan Sebastián Jaimes, full-stack developer, Bucaramanga, Colombia. Projects: emirate-scents, agendabot, undergold, tr3s-co. Status: open to remote junior roles, UTC-5, Spanish native, English B1.</desc>
